name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.*"
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          cache: true

      - name: Configure
        run: cmake -S . -B build -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR"

      - name: Build
        run: cmake --build build --config Release --target usb-restoration-tool usb-restoration-tool-tests

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Build standalone bundle
        shell: pwsh
        run: ./scripts/build-standalone.ps1 -BuildDir build

      - name: Upload Windows bundle
        uses: actions/upload-artifact@v7
        with:
          name: usb-restoration-tool-windows
          path: standalone/*.zip
          if-no-files-found: error

  build-linux:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            curl \
            libgl1-mesa-dev \
            libxkbcommon-dev \
            libfuse2 \
            file \
            exfatprogs \
            gdisk \
            fdisk

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.*"
          host: linux
          target: desktop
          arch: linux_gcc_64
          cache: true

      - name: Configure
        run: cmake -S . -B build-linux -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR"

      # usb-partition-dump is part of this list because the verification step
      # below runs it. Leaving it out is what made this job fail while the
      # release workflow, which does build it, passed.
      #
      # usb-restoration-helper is here for the opposite reason: nothing runs it
      # yet, so an explicit target is the only thing that stops it rotting.
      - name: Build
        run: >
          cmake --build build-linux --target
          usb-restoration-tool usb-restoration-tool-tests usb-partition-dump usb-restoration-helper

      - name: Test
        run: ctest --test-dir build-linux --output-on-failure

      # The partition tables the Linux backend writes are checked against the
      # tools that will have to read them. A wrong byte here is a disk that no
      # longer mounts, and nothing else in CI can touch a real disk.
      - name: Verify generated partition tables
        run: ./scripts/verify-partition-tables.sh build-linux

      - name: Build AppImage
        run: |
          chmod +x ./scripts/build-appimage.sh
          CMAKE_PREFIX_PATH="$QT_ROOT_DIR" ./scripts/build-appimage.sh

      - name: Upload AppImage
        uses: actions/upload-artifact@v7
        with:
          name: usb-restoration-tool-appimage
          path: |
            standalone/*.AppImage
            standalone/*.AppImage.sha256
          if-no-files-found: error

  # The core tests and partition tables under ASan and UBSan, then a short
  # libFuzzer run of the parsers the helper trusts nothing through.
  sanitizers:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake clang libclang-rt-18-dev qt6-base-dev gdisk fdisk

      - name: Configure
        run: >
          cmake -S . -B build-sanitize -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_COMPILER=clang++
          -DUSBRESTORE_SANITIZE=ON -DUSBRESTORE_FUZZ=ON

      - name: Build
        run: cmake --build build-sanitize --target usb-restoration-tool-tests usb-partition-dump usb-core-fuzz

      - name: Test
        env:
          UBSAN_OPTIONS: print_stacktrace=1
        run: ctest --test-dir build-sanitize --output-on-failure

      - name: Verify generated partition tables
        run: ./scripts/verify-partition-tables.sh build-sanitize

      # Fuzzes a copy so the checked-in seeds only change by hand.
      - name: Fuzz
        env:
          UBSAN_OPTIONS: print_stacktrace=1
        run: |
          mkdir -p fuzz-work fuzz-crashes
          cp tests/fuzz-corpus/* fuzz-work/
          ./build-sanitize/usb-core-fuzz -max_total_time=120 -timeout=10 -max_len=8192 \
            -artifact_prefix=fuzz-crashes/ fuzz-work

      - name: Upload fuzz crashes
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-crashes
          path: fuzz-crashes/
          if-no-files-found: ignore

  # Built against Ubuntu's own Qt rather than the kit above, because the .deb
  # depends on the distribution's Qt packages and has to link the same libraries.
  build-deb:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ qt6-base-dev dpkg-dev file exfatprogs dosfstools ntfs-3g e2fsprogs util-linux

      - name: Build .deb
        run: ./scripts/build-deb.sh

      # The same tests again, because this build links Qt 6.4 rather than 6.8.
      - name: Test
        run: ctest --test-dir build-deb --output-on-failure

      - name: Test pinned formatter mappings on disposable images
        run: sudo env USBRESTORE_TEST_LOOP=1 ./build-deb/usb-linux-tests

      - name: List package contents
        run: dpkg-deb -c standalone/*.deb

      # Installs the package but never restores: CI has no disk to spare.
      - name: Install and smoke-test the package
        run: |
          sudo apt-get install -y ./standalone/*.deb
          /usr/libexec/usb-restoration-helper --protocol-version
          pkaction --action-id dev.karoqdave.usb-restoration-tool.restore --verbose

      - name: Upload .deb
        uses: actions/upload-artifact@v7
        with:
          name: usb-restoration-tool-deb
          path: |
            standalone/*.deb
            standalone/*.deb.sha256
          if-no-files-found: error
