name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  windows:
    name: Windows x64
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.10.1'
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          dir: ${{ github.workspace }}\.deps

      - name: Build release
        shell: pwsh
        run: .\scripts\build-release.ps1 -QtDir ".\.deps\Qt\6.10.1\msvc2022_64"

      - name: Run tests
        shell: cmd
        run: |
          set "PATH=%CD%\.deps\Qt\6.10.1\msvc2022_64\bin;%PATH%"
          "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\Common7\IDE\CommonExtensions\Microsoft\CMake\CMake\bin\ctest.exe" --test-dir build -C Release --output-on-failure

      - name: Package
        shell: pwsh
        run: .\scripts\package-release.ps1 -QtDir ".\.deps\Qt\6.10.1\msvc2022_64"

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: USB-Restoration-Tool-windows-x64
          path: release/USB-Restoration-Tool-v0.1.0-windows-x64.zip
