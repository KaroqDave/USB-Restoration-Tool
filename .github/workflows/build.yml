name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.*"
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          cache: true

      - name: Configure
        run: cmake -S . -B build -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR"

      - name: Build
        run: cmake --build build --config Release --target usb-restoration-tool usb-restoration-tool-tests

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Build standalone bundle
        shell: pwsh
        run: ./scripts/build-standalone.ps1 -BuildDir build

      - name: Upload Windows bundle
        uses: actions/upload-artifact@v7
        with:
          name: usb-restoration-tool-windows
          path: standalone/*.zip
          if-no-files-found: error
